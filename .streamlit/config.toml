[theme]
base = "light"
primaryColor = "#1E6B5B"
backgroundColor = "#F4F6F0"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D2923"
linkColor = "#1E6B5B"
borderColor = "#DDE6DD"
dataframeHeaderBackgroundColor = "#EDF2E9"
dataframeBorderColor = "#DCE5DB"
chartCategoricalColors = ["#1E6B5B", "#BDD878", "#D97950", "#7775B7", "#D0AD54", "#AD7184", "#82938A"]
font = "sans serif"
headingFont = "sans serif"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["34px", "25px", "20px", "17px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "large"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
greenColor = "#24765B"
orangeColor = "#A9552E"
redColor = "#B44343"
blueColor = "#38658F"
violetColor = "#7264A7"

[theme.sidebar]
backgroundColor = "#142E28"
secondaryBackgroundColor = "#1B3A32"
textColor = "#EDF4EA"
borderColor = "#36544A"
primaryColor = "#1E6B5B"
codeBackgroundColor = "#10251F"

